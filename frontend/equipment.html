<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLab Equipment</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    
    <!-- HEADER -->

    <header>

        <h1>SmartLab Equipment</h1>

        <nav>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="my-bookings.html">
                My Bookings
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </nav>

    </header>


    
    <!-- MAIN -->
    <main>

        <h2>Available Laboratory Equipment</h2>


        
        <!-- SEARCH + FILTER -->
        <section class="filter-section">

            <input type="text" id="searchInput" placeholder="Search equipment...">


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

            </select>


            <select id="statusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="available">
                    Available
                </option>

                <option value="unavailable">
                    Unavailable
                </option>

                <option value="maintenance">
                    Maintenance
                </option>

            </select>


            <button id="clearFilters">

                Clear Filters

            </button>

        </section>


       
        <!-- EQUIPMENT LIST -->
        <section>

            <div id="equipmentContainer" class="equipment-grid">

                Loading equipment...

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

    <script src="js/equipment.js"></script>

</body>

</html>
